<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Rotation Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0B08;
    --panel: #17140F;
    --border: #2E2818;
    --amber: #D4A73C;
    --amber-bright: #F0C05A;
    --amber-dim: rgba(212, 167, 60, 0.12);
    --teal: #4A9A93;
    --teal-dim: rgba(74, 154, 147, 0.12);
    --green: #3FBF6B;
    --red: #E5534B;
    --text: #EDE6D6;
    --text-dim: #9C9484;
    --text-faint: #665F52;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,167,60,0.06), transparent);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(145deg, var(--amber-bright), var(--amber));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; color: var(--bg); font-size: 15px;
  }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
  h1 span { color: var(--text-dim); font-weight: 400; }
  .pills { display: flex; gap: 8px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
    font-family: var(--mono); border: 1px solid transparent;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill-green { background: rgba(63,191,107,0.1); color: var(--green); border-color: rgba(63,191,107,0.25); }
  .pill-green .pill-dot { background: var(--green); animation: pulse 2s infinite; }
  .pill-amber { background: var(--amber-dim); color: var(--amber-bright); border-color: rgba(212,167,60,0.25); }
  .pill-amber .pill-dot { background: var(--amber); }
  .pill-muted { background: rgba(156,148,132,0.08); color: var(--text-dim); border-color: var(--border); }
  .pill-muted .pill-dot { background: var(--text-faint); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 10px; }

  #activity-card { border-left: 3px solid var(--amber); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  #last-action { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  #last-action-detail { font-size: 13px; color: var(--text-dim); }
  #last-checked-time { font-family: var(--mono); font-size: 12px; color: var(--text-faint); white-space: nowrap; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi-value { font-family: var(--mono); font-size: 28px; font-weight: 700; margin-bottom: 6px; line-height: 1; }
  .kpi-sub { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .positive { color: var(--green); } .negative { color: var(--red); } .neutral { color: var(--text-dim); }
  #sparkline-wrap { margin-top: 10px; height: 36px; }

  .lb-row { display: grid; grid-template-columns: 70px 1fr 90px 78px; align-items: center; gap: 12px; padding: 9px 0; }
  .lb-row + .lb-row { border-top: 1px solid var(--border); }
  .lb-asset { font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .lb-track { position: relative; height: 8px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
  .lb-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .lb-fill-held { background: linear-gradient(90deg, var(--amber), var(--amber-bright)); }
  .lb-fill-unheld { background: var(--teal); opacity: 0.55; }
  .lb-fill-neg { background: var(--red); opacity: 0.4; }
  .lb-mom { font-family: var(--mono); font-size: 12.5px; text-align: right; }
  .lb-status { font-family: var(--mono); font-size: 11px; text-align: right; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 13px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  td.mono { font-family: var(--mono); }
  .asset-chip { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 26px; border-radius: 6px; font-family: var(--mono); font-weight: 700; font-size: 10.5px; background: var(--teal-dim); color: var(--teal); }
  .asset-chip.crypto { background: var(--amber-dim); color: var(--amber-bright); }
  .alloc-bar-wrap { display: flex; align-items: center; gap: 10px; }
  .alloc-track { flex: 1; height: 5px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; }
  .alloc-fill { height: 100%; background: var(--amber); border-radius: 3px; }
  .empty-state { text-align: center; color: var(--text-faint); padding: 22px; font-size: 13px; }

  footer { text-align: center; color: var(--text-faint); font-size: 12px; font-family: var(--mono); margin-top: 24px; }
  @media (max-width: 720px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .lb-row { grid-template-columns: 55px 1fr 70px 0; }
    .lb-status { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="brand">
      <div class="brand-mark">SR</div>
      <h1>Sector Rotation <span>&middot; live dashboard</span></h1>
    </div>
    <div class="pills">
      <div class="pill pill-muted" id="market-pill"><span class="pill-dot"></span><span id="market-status">--</span></div>
      <div class="pill pill-green" id="status-pill"><span class="pill-dot"></span><span id="bot-status">Loading&hellip;</span></div>
    </div>
  </header>

  <div class="card" id="activity-card">
    <div>
      <div id="last-action">--</div>
      <div id="last-action-detail">--</div>
    </div>
    <div id="last-checked-time">--</div>
  </div>

  <div class="kpi-grid">
    <div class="card">
      <div class="card-label">Total Portfolio Value</div>
      <div class="kpi-value" id="total-equity">$--</div>
      <div class="kpi-sub" id="total-return">--</div>
      <div id="sparkline-wrap"><svg id="sparkline" width="100%" height="36" viewBox="0 0 300 36" preserveAspectRatio="none"></svg></div>
    </div>
    <div class="card">
      <div class="card-label">Cash Available</div>
      <div class="kpi-value neutral" id="cash">$--</div>
      <div class="kpi-sub neutral">uninvested</div>
    </div>
    <div class="card">
      <div class="card-label">vs Starting Capital</div>
      <div class="kpi-value" id="outperformance">--</div>
      <div class="kpi-sub" id="outperf-label">--</div>
    </div>
    <div class="card">
      <div class="card-label">Last Rebalance</div>
      <div class="kpi-value neutral" id="last-rebal" style="font-size:20px;">--</div>
      <div class="kpi-sub neutral" id="next-rebal">--</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Momentum Leaderboard <span style="opacity:0.6;">&middot; risk-adjusted score</span></div>
    <div id="leaderboard"><div class="empty-state">Loading&hellip;</div></div>
  </div>

  <div class="card">
    <div class="card-label">Current Holdings</div>
    <table>
      <thead><tr><th>Asset</th><th>Quantity</th><th>Value</th><th>Allocation</th></tr></thead>
      <tbody id="holdings-body"><tr><td colspan="4" class="empty-state">Loading&hellip;</td></tr></tbody>
    </table>
  </div>

  <footer>Last updated: <span id="last-updated-time">--</span></footer>
</div>

<script>
  const assetTypes = { SPY:'stock', XLK:'stock', XLI:'stock', XLF:'stock', BTC:'crypto', ETH:'crypto', XRP:'crypto' };

  const actionLabels = {
    'rebalanced': { label: 'Rebalanced', color: 'var(--green)' },
    'no_changes_needed': { label: 'Checked — no changes needed', color: 'var(--green)' },
    'no_action_needed': { label: 'Within holding period', color: 'var(--text-dim)' },
    'skipped_market_closed': { label: 'Skipped — market closed', color: 'var(--amber-bright)' },
    'no_cash_available': { label: 'No cash available', color: 'var(--amber-bright)' },
    'buys_failed': { label: 'Buy orders failed', color: 'var(--red)' },
    'aborted_bad_data': { label: 'Aborted — bad price data', color: 'var(--red)' },
    'aborted_data_quality': { label: 'Aborted — data quality check failed', color: 'var(--red)' },
    'aborted_insufficient_data': { label: 'Aborted — not enough history', color: 'var(--red)' },
    'paused': { label: 'Paused', color: 'var(--amber-bright)' },
  };

  function fmtCurrency(v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

  function renderSparkline(history) {
    const svg = document.getElementById('sparkline');
    if (!history || history.length < 2) { svg.innerHTML = ''; return; }
    const values = history.map(h => h.equity);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const w = 300, h = 36, pad = 3;
    const pts = values.map((v, i) => {
      const x = (i / (values.length - 1)) * w;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const rising = values[values.length - 1] >= values[0];
    const color = rising ? '#3FBF6B' : '#E5534B';
    const line = `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    const areaPts = `0,${h} ${pts.join(' ')} ${w},${h}`;
    const area = `<polygon points="${areaPts}" fill="${color}" opacity="0.08"/>`;
    svg.innerHTML = area + line;
  }

  function renderLeaderboard(data) {
    const el = document.getElementById('leaderboard');
    const scores = data.scores || {};
    const moms = data.momentums || {};
    const heldSet = new Set((data.current_holdings || []).map(h => h.asset));
    const assets = Object.keys(scores).length ? Object.keys(scores) : Object.keys(moms);
    if (!assets.length) { el.innerHTML = '<div class="empty-state">No ranking data yet</div>'; return; }

    const ranked = assets.map(a => ({ asset: a, score: scores[a] ?? moms[a], mom: moms[a] ?? scores[a] }))
      .sort((a, b) => b.score - a.score);
    const maxPositive = Math.max(1, ...ranked.map(r => r.score > 0 ? r.score : 0));

    el.innerHTML = ranked.map(r => {
      const held = heldSet.has(r.asset);
      const widthPct = r.score > 0 ? Math.max(4, (r.score / maxPositive) * 100) : 3;
      const fillClass = r.score <= 0 ? 'lb-fill-neg' : (held ? 'lb-fill-held' : 'lb-fill-unheld');
      const momColor = r.mom >= 0 ? 'var(--green)' : 'var(--red)';
      return `<div class="lb-row">
        <div class="lb-asset">${r.asset}</div>
        <div class="lb-track"><div class="lb-fill ${fillClass}" style="width:${widthPct}%"></div></div>
        <div class="lb-mom" style="color:${momColor}">${fmtPct(r.mom)}</div>
        <div class="lb-status" style="color:${held ? 'var(--amber-bright)' : 'var(--text-faint)'}">${held ? '★ HELD' : '—'}</div>
      </div>`;
    }).join('');
  }

  function renderHoldings(data) {
    const tbody = document.getElementById('holdings-body');
    const holdings = data.current_holdings;
    if (!holdings || !holdings.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No holdings</td></tr>';
      return;
    }
    tbody.innerHTML = holdings.map(h => {
      const type = assetTypes[h.asset] || 'stock';
      return `<tr>
        <td><span class="asset-chip ${type}">${h.asset}</span></td>
        <td class="mono">${h.qty.toFixed(4)}</td>
        <td class="mono" style="font-weight:600">${fmtCurrency(h.value)}</td>
        <td>
          <div class="alloc-bar-wrap">
            <div class="alloc-track"><div class="alloc-fill" style="width:${h.pct}%"></div></div>
            <span class="mono" style="font-size:12.5px; min-width:42px; text-align:right;">${h.pct.toFixed(1)}%</span>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function renderDashboard(data) {
    const isRunning = data.status === 'running';
    const statusPill = document.getElementById('status-pill');
    document.getElementById('bot-status').textContent = isRunning ? 'Running' : 'Paused';
    statusPill.className = 'pill ' + (isRunning ? 'pill-green' : 'pill-amber');

    if (typeof data.market_open === 'boolean') {
      const marketPill = document.getElementById('market-pill');
      document.getElementById('market-status').textContent = data.market_open ? 'Market Open' : 'Market Closed';
      marketPill.className = 'pill ' + (data.market_open ? 'pill-green' : 'pill-muted');
    }

    const action = actionLabels[data.last_action] || { label: data.last_action || 'No activity recorded yet', color: 'var(--text-dim)' };
    const actionEl = document.getElementById('last-action');
    actionEl.textContent = action.label;
    actionEl.style.color = action.color;
    document.getElementById('last-action-detail').textContent = data.last_action_detail || '';
    document.getElementById('last-checked-time').textContent = data.last_checked ? new Date(data.last_checked).toLocaleString() : '--';

    const acct = data.account;
    if (acct) {
      document.getElementById('total-equity').textContent = fmtCurrency(acct.total_equity);
      document.getElementById('cash').textContent = fmtCurrency(acct.cash);
      const ret = acct.total_return_pct;
      const retEl = document.getElementById('total-return');
      retEl.textContent = fmtPct(ret) + ' all time';
      retEl.className = 'kpi-sub ' + (ret >= 0 ? 'positive' : 'negative');
      document.getElementById('outperformance').textContent = fmtPct(ret);
      document.getElementById('outperformance').className = 'kpi-value ' + (ret >= 0 ? 'positive' : 'negative');
      const outLabel = document.getElementById('outperf-label');
      outLabel.textContent = ret >= 0 ? 'Outperforming start' : 'Underperforming start';
      outLabel.className = 'kpi-sub ' + (ret >= 0 ? 'positive' : 'negative');
    } else {
      document.getElementById('total-equity').textContent = 'No data yet';
      document.getElementById('outperformance').textContent = '--';
    }

    if (data.last_updated) {
      const lastUp = new Date(data.last_updated);
      document.getElementById('last-updated-time').textContent = lastUp.toLocaleString();
      document.getElementById('last-rebal').textContent = lastUp.toLocaleDateString();
    }
    document.getElementById('next-rebal').textContent = 'per REBALANCE_FREQ_DAYS';

    renderSparkline(data.history);
    renderLeaderboard(data);
    renderHoldings(data);
  }

  function loadDashboard() {
    fetch('dashboard_data.json?t=' + Date.now())
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(renderDashboard)
      .catch(err => {
        document.getElementById('bot-status').textContent = 'Data unavailable';
        document.getElementById('holdings-body').innerHTML =
          '<tr><td colspan="4" class="empty-state">Could not load dashboard_data.json (' + err.message + ')</td></tr>';
        console.error('Dashboard load failed:', err);
      });
  }

  loadDashboard();
  setInterval(loadDashboard, 60000);
</script>
</body>
</html>
